<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - Poll Booth</title>
    <link rel="icon" type="image/png" href="assets/images/Poll.png">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="js/home.js"></script>
</head>
<body>
    <nav>
        <div class="container"></div>
        <div class="container2"></div>

        <nav class="navbar" id="nav">
            <ul class="nav-links">
                <li><a href="#live">Recents</a></li>
                <li><a href="#comm">Upcoming Results</a></li>
                <li><a href="#create">Your Community</a></li>
            </ul>
        </nav>

        <div class="con1">
            <div class="menu" id="menubox">
                <center>
                <table class="menu-links">
                    <tr><td><a href="home.html">Dashboard</a></td></tr>
                    <tr><td><hr></td></tr>
                    <tr><td><a href="community.html">Community</a></td></tr>
                    <tr><td><hr></td></tr>
                    <tr><td><a href="#results" style="color: grey">Results</a></td></tr>
                    <tr><td><hr></td></tr>
                    <tr><td><a href="history.html">History</a></td></tr>
                </table>
                </center>
            </div>
        </div>
        <div class="con2" id="con2">
            <input type="text" class="search-box" id="searchBox" placeholder="Type to search...">
            <div class="profile" id="profile">
                <img class="profileimg1" src="assets/images/dp.jpeg">
                <h3 style="position:fixed; top:270px; left:305px;">Dilip Velayutham</h3>
                <hr style="position:fixed; top:327px; left:287px; width:200px;"></hr>
            </div>
        </div>
        <div class="cirbar" onmouseover="display()" onmouseout="undisplay()" id="cb"></div>
        <button class="abtus" id="abtus" onmouseover="display()" onclick="aboutus()"><i style="position: absolute; left:5px; top:5px;"class="fa fa-info-circle"></i></button>
        <button class="help" id="help" onmouseover="display()"><i style="position: absolute; left:5px; top:5px;"class="fa fa-question-circle"></i></button>
        <button class="sett" id="sett" onmouseover="display()"><i style="position: absolute; left:5px; top:5px;"class="fa fa-cog"></i></button>
        </div>

        <button onclick="document.location='home.html'" class="homebutt" title="Home"><i class="fa fa-home"></button>
        <button onclick="toggleMenu()" class="elebutt" id = "menu" title="Menu"><i class="fa fa-bars"></i></button>
        <button onclick="window.close()" class="othbutt" title="Quit"><i class="fa fa-close"></i></button>
        <button class="navbutt" title="Navigation Bar" onclick="toggleNav()" id="nb"></button>
        <button onclick="toggleSearch()" class="searchbutt" id="sb" title="Search"><i class="fa fa-search"></i></button>
        <button onclick="toggleProfile()" class="profilebutt" id="pb" title="Profile"><i class="fa fa-user"></i></button>
        <button class=><img class="profileimg" src="assets/images/Poll.png"></button>
    </nav>
    <section>
        <h1 class="greet">History</h1>
        <h3 class="subtitles" style="top:200px; left: 460px;" id="live">Recents</h3> 
        <h4 class="subtitles" style="top:300px; left: 460px; font-size: 20px; font-weight: 100;">--- History have not been recorded yet ---</h4>
        <h3 class="subtitles" style="top:500px; left:460px;" id="comm"></h3>
    </section>

</body>
</html>
