<body>
    <header>
        <h1>Community Hub</h1>

        <button onclick="searchCommunity()">Search</button>
        <button onclick="showCreateForm()">Create Community</button>

    <div id="mainContainer">
        <div id="chatSection">
            <h2 id="chatTitle"></h2>
            <div id="chatBox"></div>
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
            <button onclick="closeChat()">Close Chat</button>
        </div>
        
        <div id="pollSection">
            <h2>Active Polls</h2>
            <div id="pollsList"></div>
        </div>
    </div>
    
    <script>
        let communities = [];
        let currentCommunity = null;
        const encryptionKey = "secretKey123";
        let web3 = new Web3(Web3.givenProvider || "http://localhost:8545");
        let userVotes = {};

        async function vote(pollIndex, optionIndex) {
            if (userVotes[currentCommunity.name + pollIndex]) {
                alert("You can only vote once.");
                return;
            }
            try {
                const accounts = await web3.eth.getAccounts();
                const contract = new web3.eth.Contract(abi, contractAddress);

        async function searchCommunity() {
            const query = document.getElementById("searchCommunity").value;

    <!-- Solidity Smart Contract -->
    <script type="solidity">
    pragma solidity ^0.8.0;
    
    contract Voting {
        struct Poll {
            string question;
            string[] options;
            mapping(uint => uint) votes;
            mapping(address => bool) hasVoted;
        }
        
        Poll[] public polls;
        
        function createPoll(string memory _question, string[] memory _options) public {
            Poll storage newPoll = polls.push();
            newPoll.question = _question;
            newPoll.options = _options;
        }
        
        function vote(uint _pollIndex, uint _optionIndex) public {
            require(!polls[_pollIndex].hasVoted[msg.sender], "You have already voted.");
            polls[_pollIndex].votes[_optionIndex]++;
            polls[_pollIndex].hasVoted[msg.sender] = true;
        }
        
        function getVotes(uint _pollIndex, uint _optionIndex) public view returns (uint) {
            return polls[_pollIndex].votes[_optionIndex];
        }
    }
    </script>

    </script>
